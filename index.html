document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ttom:6px\">📚 Admin Login<\u002Fdiv>\n      <div style=\"font:14px Lato;color:#9a8878\">Enter your credentials to manage the library<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-bottom:14px\">\n      <label style=\"font:700 11px Lato;color:#7a6a58;text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:5px\">Username<\u002Flabel>\n      <input type=\"text\" value=\"{{ loginUser }}\" onchange=\"{{ onLoginUser }}\" placeholder=\"admin\" style=\"width:100%;padding:10px 14px;border:1.5px solid #e0d0bc;border-radius:7px;font:14px Lato;color:#2c1e10;background:#fff;outline:none\">\n    <\u002Fdiv>\n    <div style=\"margin-bottom:18px\">\n      <label style=\"font:700 11px Lato;color:#7a6a58;text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:5px\">Password<\u002Flabel>\n      <input type=\"password\" value=\"{{ loginPass }}\" onchange=\"{{ onLoginPass }}\" placeholder=\"••••••••\" style=\"width:100%;padding:10px 14px;border:1.5px solid #e0d0bc;border-radius:7px;font:14px Lato;color:#2c1e10;background:#fff;outline:none\">\n    <\u002Fdiv>\n    <sc-if value=\"{{ hasLoginErr }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"font:13px Lato;color:#b04040;text-align:center;margin-bottom:12px\">{{ loginErr }}<\u002Fdiv>\n    <\u002Fsc-if>\n    <button onclick=\"{{ doLogin }}\" style=\"width:100%;padding:11px;background:#7c5535;color:#fff;border:none;border-radius:7px;font:700 14px Lato;cursor:pointer;margin-bottom:10px\">Sign In<\u002Fbutton>\n    <button onclick=\"{{ toggleLogin }}\" style=\"width:100%;padding:11px;background:transparent;color:#9a8878;border:1.5px solid #e0d0bc;border-radius:7px;font:14px Lato;cursor:pointer\">Cancel<\u002Fbutton>\n    <div style=\"font:12px Lato;color:#c0b0a0;text-align:center;margin-top:14px\">Default: admin / booklover<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- MAIN APP -->\n<div style=\"display:flex;flex-direction:column;height:100vh;overflow:hidden\">\n\n  <!-- TOP BAR -->\n  <div style=\"display:flex;align-items:center;gap:12px;padding:0 24px;height:56px;background:#fff;border-bottom:1px solid #e8ddd0;flex-shrink:0;box-shadow:0 1px 3px rgba(44,30,16,.05)\">\n    <span style=\"font:700 21px 'Playfair Display',serif;color:#2c1e10;white-space:nowrap;letter-spacing:-.02em\">📚 My Library<\u002Fspan>\n    <div style=\"display:flex;gap:4px;margin-left:auto\">\n      <button onclick=\"{{ setGrid }}\" title=\"Grid view\" style=\"width:32px;height:32px;border:1.5px solid #e0d0bc;border-radius:6px;background:{{ gridBtnBg }};color:{{ gridBtnColor }};cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center\">⊞<\u002Fbutton>\n      <button onclick=\"{{ setList }}\" title=\"List view\" style=\"width:32px;height:32px;border:1.5px solid #e0d0bc;border-radius:6px;background:{{ listBtnBg }};color:{{ listBtnColor }};cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center\">☰<\u002Fbutton>\n    <\u002Fdiv>\n    <sc-if value=\"{{ isAdmin }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;gap:8px\">\n        <button onclick=\"{{ openImport }}\" style=\"padding:7px 13px;background:#faf7f2;color:#7a6a58;border:1.5px solid #e0d0bc;border-radius:7px;font:13px Lato;cursor:pointer\">⬆ Import CSV<\u002Fbutton>\n        <button onclick=\"{{ openAddBook }}\" style=\"padding:7px 13px;background:#7c5535;color:#fff;border:none;border-radius:7px;font:700 13px Lato;cursor:pointer\">+ Add Book<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:8px;padding:4px 12px;background:#f5ede0;border-radius:20px\">\n        <span style=\"width:6px;height:6px;border-radius:50%;background:#7c5535;display:inline-block;flex-shrink:0\"><\u002Fspan>\n        <span style=\"font:700 12px Lato;color:#7c5535\">Admin<\u002Fspan>\n        <button onclick=\"{{ doLogout }}\" style=\"font:12px Lato;color:#b0907a;background:none;border:none;cursor:pointer;padding:0\">Sign out<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ isNotAdmin }}\" hint-placeholder-val=\"{{ false }}\">\n      <button onclick=\"{{ toggleLogin }}\" title=\"Admin login\" style=\"width:30px;height:30px;border:1px solid #ece0d0;border-radius:6px;background:#faf7f2;color:#c8b8a0;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center\">🔐<\u002Fbutton>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  <!-- CONTENT ROW -->\n  <div style=\"display:flex;flex:1;overflow:hidden\">\n\n    <!-- SIDEBAR -->\n    <div style=\"width:224px;flex-shrink:0;background:#f5efe5;border-right:1px solid #e8ddd0;display:flex;flex-direction:column\">\n      <div style=\"padding:14px 16px 10px;flex-shrink:0\">\n        <button onclick=\"{{ openGoals }}\" style=\"display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; padding: 7px 10px; background: #f0e4d4; color: #7c5535; border: 1px solid #ddc8a8; border-radius: 6px; font: 700 12px Lato; cursor: pointer; text-align: left\">🎯 READING GOALS<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"height:1px;background:#e8ddd0;margin:0 16px 8px;flex-shrink:0\"><\u002Fdiv>\n      <div style=\"flex:1;overflow-y:auto;padding-bottom:14px\">\n      <div style=\"padding:0 16px 14px\">\n        <div style=\"font:700 10px Lato;color:#c0a890;text-transform:uppercase;letter-spacing:.1em;margin-bottom:9px\">Status<\u002Fdiv>\n        <button onclick=\"{{ setFilterAll }}\" style=\"display:flex;justify-content:space-between;align-items:center;width:100%;padding:7px 10px;border:none;border-radius:6px;background:{{ faAll }};color:{{ fcAll }};cursor:pointer;margin-bottom:2px;text-align:left\">\n          <span style=\"font:{{ fwAll }} 13px Lato\">All Books<\u002Fspan>\n        <\u002Fbutton>\n        <button onclick=\"{{ setFilterReading }}\" style=\"display:flex;justify-content:space-between;align-items:center;width:100%;padding:7px 10px;border:none;border-radius:6px;background:{{ faReading }};color:{{ fcReading }};cursor:pointer;margin-bottom:2px;text-align:left\">\n          <span style=\"font:{{ fwReading }} 13px Lato\">Reading<\u002Fspan><span style=\"font:12px Lato;opacity:.7\">{{ sc.reading }}<\u002Fspan>\n        <\u002Fbutton>\n        <button onclick=\"{{ setFilterWant }}\" style=\"display:flex;justify-content:space-between;align-items:center;width:100%;padding:7px 10px;border:none;border-radius:6px;background:{{ faWant }};color:{{ fcWant }};cursor:pointer;margin-bottom:2px;text-align:left\">\n          <span style=\"font:{{ fwWant }} 13px Lato\">Want to Read<\u002Fspan><span style=\"font:12px Lato;opacity:.7\">{{ sc.wantToRead }}<\u002Fspan>\n        <\u002Fbutton>\n        <button onclick=\"{{ setFilterFinished }}\" style=\"display:flex;justify-content:space-between;align-items:center;width:100%;padding:7px 10px;border:none;border-radius:6px;background:{{ faFinished }};color:{{ fcFinished }};cursor:pointer;margin-bottom:2px;text-align:left\">\n          <span style=\"font:{{ fwFinished }} 13px Lato\">Finished<\u002Fspan><span style=\"font:12px Lato;opacity:.7\">{{ sc.finished }}<\u002Fspan>\n        <\u002Fbutton>\n        <button onclick=\"{{ setFilterReread }}\" style=\"display:flex;justify-content:space-between;align-items:center;width:100%;padding:7px 10px;border:none;border-radius:6px;background:{{ faReread }};color:{{ fcReread }};cursor:pointer;margin-bottom:2px;text-align:left\">\n          <span style=\"font:{{ fwReread }} 13px Lato\">Re-reading<\u002Fspan><span style=\"font:12px Lato;opacity:.7\">{{ sc.reReading }}<\u002Fspan>\n        <\u002Fbutton>\n        <button onclick=\"{{ setFilterHold }}\" style=\"display:flex;justify-content:space-between;align-items:center;width:100%;padding:7px 10px;border:none;border-radius:6px;background:{{ faHold }};color:{{ fcHold }};cursor:pointer;margin-bottom:2px;text-align:left\">\n          <span style=\"font:{{ fwHold }} 13px Lato\">On Hold<\u002Fspan><span style=\"font:12px Lato;opacity:.7\">{{ sc.onHold }}<\u002Fspan>\n        <\u002Fbutton>\n        <button onclick=\"{{ setFilterDnf }}\" style=\"display:flex;justify-content:space-between;align-items:center;width:100%;padding:7px 10px;border:none;border-radius:6px;background:{{ faDnf }};color:{{ fcDnf }};cursor:pointer;margin-bottom:2px;text-align:left\">\n          <span style=\"font:{{ fwDnf }} 13px Lato\">DNF<\u002Fspan><span style=\"font:12px Lato;opacity:.7\">{{ sc.dnf }}<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fdiv>\n\n      <div style=\"height:1px;background:#e8ddd0;margin:4px 16px 14px\"><\u002Fdiv>\n\n      <div style=\"padding:0 16px\">\n        <div style=\"font:700 10px Lato;color:#c0a890;text-transform:uppercase;letter-spacing:.1em;margin-bottom:9px\">Genre<\u002Fdiv>\n        <button onclick=\"{{ setFilterGenreAll }}\" style=\"display:flex;justify-content:space-between;align-items:center;width:100%;padding:7px 10px;border:none;border-radius:6px;background:{{ faGenreAll }};color:{{ fcGenreAll }};cursor:pointer;margin-bottom:2px;text-align:left\">\n          <span style=\"font:{{ fwGenreAll }} 13px Lato\">All Genres<\u002Fspan>\n        <\u002Fbutton>\n        <sc-for list=\"{{ sidebarGenres }}\" as=\"g\" hint-placeholder-count=\"5\">\n          <button onclick=\"{{ g.onClick }}\" style=\"display:flex;justify-content:space-between;align-items:center;width:100%;padding:7px 10px;border:none;border-radius:6px;background:{{ g.bg }};color:{{ g.color }};cursor:pointer;margin-bottom:2px;text-align:left\">\n            <span style=\"font:{{ g.weight }} 13px Lato\">{{ g.name }}<\u002Fspan><span style=\"font:12px Lato;opacity:.7\">{{ g.count }}<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"height:1px;background:#e8ddd0;margin:4px 16px 14px\"><\u002Fdiv>\n\n      <div style=\"padding:0 16px 14px\">\n        <div style=\"font:700 10px Lato;color:#c0a890;text-transform:uppercase;letter-spacing:.1em;margin-bottom:9px\">Rating<\u002Fdiv>\n        <button onclick=\"{{ setFilterRatingAll }}\" style=\"display:flex;width:100%;padding:7px 10px;border:none;border-radius:6px;background:{{ faRatingAll }};color:{{ fcRatingAll }};cursor:pointer;margin-bottom:2px;text-align:left\">\n          <span style=\"font:{{ fwRatingAll }} 13px Lato\">All Ratings<\u002Fspan>\n        <\u002Fbutton>\n        <button onclick=\"{{ setFilterRating5 }}\" style=\"width:100%;padding:7px 10px;border:none;border-radius:6px;background:{{ faRating5 }};cursor:pointer;margin-bottom:2px;text-align:left\">\n          <span style=\"font:{{ fwRating5 }} 14px Lato;color:{{ fcStars5 }};letter-spacing:.04em\">★★★★★<\u002Fspan>\n        <\u002Fbutton>\n        <button onclick=\"{{ setFilterRating4 }}\" style=\"width:100%;padding:7px 10px;border:none;border-radius:6px;background:{{ faRating4 }};cursor:pointer;margin-bottom:2px;text-align:left\">\n          <span style=\"font:{{ fwRating4 }} 14px Lato;color:{{ fcStars4 }};letter-spacing:.04em\">★★★★☆<\u002Fspan>\n        <\u002Fbutton>\n        <button onclick=\"{{ setFilterRating3 }}\" style=\"width:100%;padding:7px 10px;border:none;border-radius:6px;background:{{ faRating3 }};cursor:pointer;margin-bottom:2px;text-align:left\">\n          <span style=\"font:{{ fwRating3 }} 14px Lato;color:{{ fcStars3 }};letter-spacing:.04em\">★★★☆☆<\u002Fspan>\n        <\u002Fbutton>\n        <button onclick=\"{{ setFilterRating2 }}\" style=\"width:100%;padding:7px 10px;border:none;border-radius:6px;background:{{ faRating2 }};cursor:pointer;margin-bottom:2px;text-align:left\">\n          <span style=\"font:{{ fwRating2 }} 14px Lato;color:{{ fcStars2 }};letter-spacing:.04em\">★★☆☆☆<\u002Fspan>\n        <\u002Fbutton>\n        <button onclick=\"{{ setFilterRating1 }}\" style=\"width:100%;padding:7px 10px;border:none;border-radius:6px;background:{{ faRating1 }};cursor:pointer;margin-bottom:2px;text-align:left\">\n          <span style=\"font:{{ fwRating1 }} 14px Lato;color:{{ fcStars1 }};letter-spacing:.04em\">★☆☆☆☆<\u002Fspan>\n        <\u002Fbutton>\n        <button onclick=\"{{ setFilterRating0 }}\" style=\"display:flex;width:100%;padding:7px 10px;border:none;border-radius:6px;background:{{ faRating0 }};color:{{ fcRating0 }};cursor:pointer;margin-bottom:2px;text-align:left\">\n          <span style=\"font:{{ fwRating0 }} 14px Lato;color:{{ fcStars0 }};letter-spacing:.04em\">☆☆☆☆☆<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- MAIN AREA -->\n    <div style=\"flex:1;display:flex;flex-direction:column;overflow:hidden\">\n\n      <!-- CONTENT HEADER -->\n      <div style=\"display:flex;align-items:center;gap:10px;padding:10px 24px;border-bottom:1px solid #e8ddd0;background:#fff;flex-shrink:0\">\n        <div style=\"flex:1;display:flex;align-items:center;gap:8px;border:1.5px solid #e0d0bc;border-radius:8px;padding:0 12px;background:#faf7f2;height:36px\">\n          <span style=\"color:#c0a880;font-size:14px\">🔍<\u002Fspan>\n          <input type=\"text\" value=\"{{ searchQuery }}\" onchange=\"{{ onSearch }}\" placeholder=\"Search title, author, genre…\" style=\"flex:1;border:none;background:transparent;font:14px Lato;color:#2c1e10;outline:none\">\n        <\u002Fdiv>\n        <span style=\"font:13px Lato;color:#c0a890;white-space:nowrap\">{{ filteredCount }} of {{ totalCount }}<\u002Fspan>\n        <select onchange=\"{{ onSort }}\" style=\"border:1.5px solid #e0d0bc;border-radius:6px;padding:6px 10px;font:13px Lato;color:#7a6a58;background:#faf7f2;outline:none;cursor:pointer\">\n          <option value=\"date-added\">Recently Added<\u002Foption>\n          <option value=\"title\">Title A–Z<\u002Foption>\n          <option value=\"author\">Author A–Z<\u002Foption>\n          <option value=\"rating\">Highest Rated<\u002Foption>\n          <option value=\"date-finished\">Date Finished<\u002Foption>\n          <option value=\"format\">Format<\u002Foption>\n          <option value=\"source\">Source<\u002Foption>\n        <\u002Fselect>\n      <\u002Fdiv>\n\n      <!-- GRID VIEW -->\n      <sc-if value=\"{{ isGrid }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"flex:1;display:flex;flex-direction:column;overflow:hidden\">\n          <div style=\"flex:1;overflow-y:auto;padding:24px\">\n            <sc-if value=\"{{ noBooks }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"text-align:center;padding:80px 24px\">\n                <div style=\"font:36px sans-serif;margin-bottom:12px\">📭<\u002Fdiv>\n                <div style=\"font:700 18px 'Playfair Display',serif;color:#2c1e10;margin-bottom:6px\">No books found<\u002Fdiv>\n                <div style=\"font:14px Lato;color:#b0a090\">Try adjusting your filters or search query.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ hasBooks }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(142px,1fr));gap:22px\">\n                <sc-for list=\"{{ paginatedBooks }}\" as=\"book\" hint-placeholder-count=\"10\">\n                  <div onclick=\"{{ book.onClick }}\" style=\"cursor:pointer;display:flex;flex-direction:column;gap:8px\">\n                    <div style=\"position:relative;width:100%;aspect-ratio:2/3;background:repeating-linear-gradient(135deg,#d4ccc2 0,#d4ccc2 2px,#e8e2d8 2px,#e8e2d8 10px);border-radius:5px;overflow:hidden;box-shadow:2px 4px 10px rgba(44,30,16,.15),inset 0 0 0 1px rgba(0,0,0,.06)\">\n                      <div style=\"position:absolute;bottom:7px;left:7px;background:rgba(0,0,0,.52);color:#fff;border-radius:4px;padding:2px 7px;font:700 11px Lato\">{{ book.typeIcon }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"font:700 13px 'Playfair Display',serif;color:#2c1e10;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden\">{{ book.title }}<\u002Fdiv>\n                    <div style=\" ;background:#fff;color:#7a6a58;cursor:pointer;font-size:16px;opacity:{{ lastBtnOpacity }};display:flex;align-items:center;justify-content:center\">›<\u002Fbutton>\n              <button onclick=\"{{ goLastPage }}\" style=\"width:32px;height:32px;border:1.5px solid #e0d0bc;border-radius:6px;background:#fff;color:#7a6a58;cursor:pointer;font:700 13px Lato;opacity:{{ lastBtnOpacity }};display:flex;align-items:center;justify-content:center\">»<\u002Fbutton>\n              <span style=\"font:12px Lato;color:#b0a090;margin-left:6px\">{{ pageInfo }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- LIST VIEW -->\n      <sc-if value=\"{{ isList }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"flex:1;display:flex;flex-direction:column;overflow:hidden\">\n          <div style=\"flex:1;overflow-y:auto\">\n            <sc-if value=\"{{ noBooks }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"text-align:center;padding:80px 24px\">\n                <div style=\"font:36px sans-serif;margin-bottom:12px\">📭<\u002Fdiv>\n                <div style=\"font:700 18px 'Playfair Display',serif;color:#2c1e10\">No books found<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ hasBooks }}\" hint-placeholder-val=\"{{ true }}\">\n              <sc-for list=\"{{ paginatedBooks }}\" as=\"book\" hint-placeholder-count=\"6\">\n                    <\u002Fsc-for><table style=\"width:100%\">\n                <thead>\n                  <tr style=\"background:#f5efe5;position:sticky;top:0;z-index:1\">\n                    <th style=\"padding:10px 14px;text-align:left;font:700 10px Lato;color:#b0a090;text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid #e8ddd0;width:42px\"><\u002Fth>\n                    <th style=\"padding:10px 14px;text-align:left;font:700 10px Lato;color:#b0a090;text-transform:uppercase;letter-spacing:.08em;border-bottom: #c8a060\">{{ book.stars }}<\u002Ftd>\n                      <td style=\"padding:11px 14px;font:13px Lato;color:#9a8878\">{{ book.pages }}<\u002Ftd>\n                    <\u002Ftr>\n                  \n                <\u002Ftbody>\n              <\u002Ftable>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <sc-if value=\"{{ hasMultiplePages }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;align-items:center;justify-content:center;gap:4px;padding:11px 24px;border-top:1px solid #e8ddd0;background:#fff;flex-shrink:0;flex-wrap:wrap\">\n              <button onclick=\"{{ goFirstPage }}\" style=\"width:32px;height:32px;border:1.5px solid #e0d0bc;border-radius:6px;background:#fff;color:#7a6a58;cursor:pointer;font:700 13px Lato;opacity:{{ firstBtnOpacity }};display:flex;align-items:center;justify-content:center\">«<\u002Fbutton>\n              <button onclick=\"{{ goPrevPage }}\" style=\"width:32px;height:32px;border:1.5px solid #e0d0bc;border-radius:6px;background:#fff;color:#7a6a58;cursor:pointer;font-size:16px;opacity:{{ firstBtnOpacity }};display:flex;align-items:center;justify-content:center\">‹<\u002Fbutton>\n              <sc-for list=\"{{ pageButtons }}\" as=\"pb\" hint-placeholder-count=\"3\">\n                <button onclick=\"{{ pb.onClick }}\" style=\"min-width:32px;height:32px;padding:0 8px;border:{{ pb.border }};border-radius:6px;background:{{ pb.bg }};color:{{ pb.color }};cursor:pointer;font:{{ pb.fw }} 13px Lato;display:flex;align-items:center;justify-content:center\">{{ pb.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n              <button onclick=\"{{ goNextPage }}\" style=\"width:32px;height:32px;border:1.5px solid #e0d0bc;border-radius:6px;background:#fff;color:#7a6a58;cursor:pointer;font-size:16px;opacity:{{ lastBtnOpacity }};display:flex;align-items:center;justify-content:center\">›<\u002Fbutton>\n              <button onclick=\"{{ goLastPage }}\" style=\"width:32px;height:32px;border:1.5px solid #e al=\"{{ false }}\">\n                <button onclick=\"{{ openGoalsEdit }}\" style=\"margin-left:auto;padding:4px 11px;background:#f5ede0;color:#7c5535;border:1px solid #ddc8a8;border-radius:5px;font:700 11px Lato;cursor:pointer\">Edit<\u002Fbutton>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:11px\">\n              <div style=\"display:flex;align-items:center;gap:11px\">\n                <div style=\"width:34px;height:34px;background:#f5ede0;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0\">📚<\u002Fdiv>\n                <div><div style=\"font:700 14px Lato;color:#2c1e10\">{{ goals.booksGoal }} books<\u002Fdiv><div style=\"font:12px Lato;color:#9a8878\">Target for {{ currentYear }}<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:11px\">\n                <div style=\"width:34px;height:34px;background:#f5ede0;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0\">📄<\u002Fdiv>\n                <div><div style=\"font:700 14px Lato;color:#2c1e10\">{{ goals.dailyPages }} pages / day<\u002Fdiv><div style=\"font:12px Lato;color:#9a8878\">Daily reading goal<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:11px\">\n                <div style=\"width:34px;height:34px;background:#f5ede0;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0\">🔖<\u002Fdiv>\n                <div><div style=\"font:700 14px Lato;color:#2c1e10\">{{ goalsTargetGenre }}<\u002Fdiv><div style=\"font:12px Lato;color:#9a8878\">Target genre (optional)<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- Goals edit form -->\n        <sc-if value=\"{{ goalsEdit }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:#fff;border:1px solid #e8ddd0;border-radius:10px;padding:18px\">\n            <div style=\"font:700 11px Lato;color:#b0a090;text-transform:uppercase;letter-spacing:.09em;margin-bottom:14px\">Edit Goals<\u002Fdiv>\n            <div style=\"margin-bottom:12px\">\n              <label style=\"font:700 11px Lato;color:#7a6a58;display:block;margin-bottom:5px\">Books to read in {{ currentYear }}<\u002Flabel>\n              <input type=\"number\" value=\"{{ goalsForm.booksGoal }}\" onchange=\"{{ onGoalsBooksGoal }}\" min=\"1\" style=\"width:100%;padding:8px 11px;border:1.5px solid #e0d0bc;border-radius:6px;font:14px Lato;color:#2c1e10;background:#faf7f2;outline:none\">\n            <\u002Fdiv>\n            <div style=\"margin-bottom:12px\">\n              <label style=\"font:700 11px Lato;color:#7a6a58;display:block;margin-bottom:5px\">Daily page count goal<\u002Flabel>\n              <input type=\"number\" value=\"{{ goalsForm.dailyPages }}\" onchange=\"{{ onGoalsPages }}\" min=\"1\" style=\"width:100%;padding:8px 11px;border:1.5px solid #e0d0bc;border-radius:6px;font:14px Lato;color:#2c1e10;background:#faf7f2;outline:none\">\n            <\u002Fdiv>\n            <div style=\"margin-bottom:16px\">\n              <label style=\"font:700 11px Lato;color:#7a6a58;display:block;margin-bottom:5px\">Target genre <span style=\"font-weight:400;color:#b0a090\">(optional)<\u002Fspan><\u002Flabel>\n              <input type=\"text\" value=\"{{ goalsForm.targetGenre }}\" onchange=\"{{ onGoalsGenre }}\" placeholder=\"e.g. Non-Fiction\" style=\"width:100%;padding:8px 11px;border:1.5px solid #e0d0bc;border-radius:6px;font:14px Lato;color:#2c1e10;background:#faf7f2;outline:none\">\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:8px\">\n              <button onclick=\"{{ saveGoals }}\" style=\"flex:1;padding:9px;background:#7c5535;color:#fff;border:none;border-radius:6px;font:700 13px Lato;cursor:pointer\">Save Goals<\u002Fbutton>\n              <button onclick=\"{{ cancelGoalsEdit }}\" style=\"flex:1;padding:9px;background:#faf7f2;color:#9a8878;border:1.5px solid #e0d0bc;border-radius:6px;font:13px Lato;cursor:pointer\">Cancel<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- Progress donut -->\n        <div style=\"background:#fff;border:1px solid #e8ddd0;border-radius:10px;padding:18px\">\n          <div style=\"font:700 11px Lato;color:#b0a090;text-transform:uppercase;letter-spacing:.09em;margin-bottom:16px\">Progress — {{ currentYear }}<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:22px\">\n            <div style=\"position:relative;width:138px;height:138px;flex-shrink:0\">\n              <svg width=\"138\" height=\"138\" viewBox=\"0 0 140 140\">\n                <circle cx=\"70\" cy=\"70\" r=\"52\" fill=\"none\" stroke=\"#e8ddd0\" stroke-width=\"13\"><\u002Fcircle>\n                <circle cx=\"70\" cy=\"70\" r=\"52\" fill=\"none\" stroke=\"#7c5535\" stroke-width=\"13\" stroke-dasharray=\"{{ donutDash }}\" stroke-linecap=\"round\" transform=\"rotate(-90 70 70)\"><\u002Fcircle>\n              <\u002Fsvg>\n              <div style=\"position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center\">\n                <div style=\"font:700 26px 'Playfair Display',serif;color:#2c1e10;line-height:1\">{{ finishedThisYear }}<\u002Fdiv>\n                <div style=\"font:11px Lato;color:#9a8878;margin-top:2px\">of {{ goals.booksGoal }}<\u002Fdiv>\n                <div style=\"font:700 13px Lato;color:#7c5535;margin-top:3px\">{{ donutPct }}%<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font:600 15px 'Playfair Display',serif;color:#2c1e10;margin-bottom:5px\">{{ finishedThisYear }} books read<\u002Fdiv>\n              <div style=\"font:13px Lato;color:#9a8878;line-height:1.7\">Goal \">\n          <div style=\"display:flex;align-items:center;margin-bottom:14px\">\n            <button onclick=\"{{ prevMonth }}\" style=\"width:26px;height:26px;border:1px solid #e0d0bc;border-radius:5px;background:#faf7f2;cursor:pointer;font-size:15px;color:#7a6a58;display:flex;align-items:center;justify-content:center\">‹<\u002Fbutton>\n            <span style=\"flex:1;text-align:center;font:700 13px Lato;color:#2c1e10\">{{ calMonthName }} {{ calYear }}<\u002Fspan>\n            <button onclick=\"{{ nextMonth }}\" style=\"width:26px;height:26px;border:1px solid #e0d0bc;border-radius:5px;background:#faf7f2;cursor:pointer;font-size:15px;color:#7a6a58;display:flex;align-items:center;justify-content:center\">›<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:5px\">\n            <div style=\"text-align:center;font:700 10px Lato;color:#c0a890;padding:3px 0\">M<\u002Fdiv>\n            <div style=\"text-align:center;font:700 10px Lato;color:#c0a890;padding:3px 0\">T<\u002Fdiv>\n            <div style=\"text-align:center;font:700 10px Lato;color:#c0a890;padding:3px 0\">W<\u002Fdiv>\n            <div style=\"text-align:center;font:700 10px Lato;color:#c0a890;padding:3px 0\">T<\u002Fdiv>\n            <div style=\"text-align:center;font:700 10px Lato;color:#c0a890;padding:3px 0\">F<\u002Fdiv>\n            <div style=\"text-align:center;font:700 10px Lato;color:#c0a890;padding:3px 0\">S<\u002Fdiv>\n            <div style=\"text-align:center;font:700 10px Lato;color:#c0a890;padding:3px 0\">S<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(7,1fr);gap:2px\">\n            <sc-for list=\"{{ calDays }}\" as=\"day\" hint-placeholder-count=\"35\">\n              <div style=\"display:flex;align-items:center;justify-content:center;aspect-ratio:1;border-radius:50%;background:{{ day.circleColor }};border:{{ day.borderStyle }}\">\n                <span style=\"font:600 11px Lato;color:{{ day.textColor }}\">{{ day.label }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:14px;margin-top:11px;padding-top:11px;border-top:1px solid #f0e8dc\">\n            <div style=\"display:flex;align-items:center;gap:4px\"><div style=\"width:9px;height:9px;border-radius:50%;background:#3d7a54\"><\u002Fdiv><span style=\"font:11px Lato;color:#9a8878\">Met<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:4px\"><div style=\"width:9px;height:9px;border-radius:50%;background:#b07028\"><\u002Fdiv><span style=\"font:11px Lato;color:#9a8878\">Partial<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:4px\"><div style=\"width:9px;height:9px;border-radius:50%;background:#b04040\"><\u002Fdiv><span style=\"font:11px Lato;color:#9a8878\">Missed<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- Year in review -->\n        <div style=\"background:#fff;border:1px solid #e8ddd0;border-radius:10px;padding:18px\">\n          <div style=\"font:700 11px Lato;color:#b0a090;text-transform:uppercase;letter-spacing:.09em;margin-bottom:16px\">{{ currentYear }} Year in Review<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:14px\">\n            <div style=\"display:flex;align-items:center;gap:11px\">\n              <div style=\"width:38px;height:38px;background:#f5ede0;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0\">📚<\u002Fdiv>\n              <div><div style=\"font:700 17px 'Playfair Display',serif;color:#2c1e10\">{{ yearStats.booksCount }} books<\u002Fdiv><div style=\"font:12px Lato;color:#9a8878\">finished this year<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font:700 10px Lato;color:#b0a090;text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px\">By Genre<\u002Fdiv>\n              <div style=\"font:13px Lato;color:#7a6a58;line-height:1.7\">{{ yearStats.genreSummary }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:11px\">\n              <div style=\"width:38px;height:38px;background:#f5ede0;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0\">📄<\u002Fdiv>\n              <div><div style=\"font:700 17px 'Playfair Display',serif;color:#2c1e10\">{{ yearStats.pagesRead }} pages<\u002Fdiv><div style=\"font:12px Lato;color:#9a8878\">tracked via daily log<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- BOOK DETAIL MODAL -->\n<sc-if value=\"{{ showBookDetail }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(20,10,5,.52);z-index:120;display:flex;align-items:center;justify-content:center;padding:24px\">\n    <div style=\"background:#faf7f2;border-radius:14px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;box-shadow:0 24px 64px rgba(0,0,0,.28)\">\n\n      <div style=\"display:flex;align-items:flex-start;padding:24px 24px 0;gap:18px\">\n        <div style=\"width:80px;height:120px;background:repeating-linear-gradient(135deg,#d4ccc2 0,#d4ccc2 2px,#e8e2d8 2px,#e8e2d8 10px);border-radius:4px;box-shadow:2px 3px 10px rgba(44,30,16,.18);flex-shrink:0;overflow:hidden;position:relative\">\n          <sc-if value=\"{{ selectedBookHasCover }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"{{ selectedBookCoverStyle }}\"><\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"flex:1;padding-top:4px\">\n          <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:7px;flex-wrap:wrap\">\n            <span style=\"padding:3px 9px;border-radius:10px;font:700 10px Lato;background:{{ selectedBook.statusBg }};color:#fff\">{{ selectedBook.statusLabel }}<\u002Fspan>\n            <span style=\"font:13px Lato;color:#9a8878\">{{ selectedBook.typeLabel }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font:700 20px 'Playfair Display',serif;color:#2c1e10;line-height:1.3;margin-bottom:4px\">{{ selectedBook.title }}<\u002Fdiv>\n          <div style=\"font:14px Lato;color:#7a6a58;margin-bottom:6px\">{{ selectedBook.author }}<\u002Fdiv>\n          <div style=\"font:15px Lato;color:#c8a060;letter-spacing:.04em\">{{ selectedBook.stars }}<\u002Fdiv>\n        <\u002Fdiv>\n        <button onclick=\"{{ closeBookDetail }}\" style=\"width:30px;height:30px;border:none;background:#f5ede0;border-radius:50%;color:#7c5535;cursor:pointer;flex-shrink:0;font-size:14px;display:flex;align-items:center;justify-content:center\">✕<\u002Fbutton>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:0;padding:18px 24px;border-top:1px solid #e8ddd0;margin-top:18px\">\n        <div style=\"padding:9px 0;border-bottom:1px solid #f0e8dc\">\n          <div style=\"font:700 10px Lato;color:#c0a890;text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px\">Genre<\u002Fdiv>\n          <div style=\"font:14px Lato;color:#2c1e10\">{{ selectedBook.genre }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:9px 0;border-bottom:1px solid #f0e8dc\">\n          <div style=\"font:700 10px Lato;color:#c0a890;text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px\">Year Published<\u002Fdiv>\n          <div style=\"font:14px Lato;color:#2c1e10\">{{ selectedBook.yearPublished }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:9px 0;border-bottom:1px solid #f0e8dc\">\n          <div style=\"font:700 10px Lato;color:#c0a890;text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px\">Pages<\u002Fdiv>\n          <div style=\"font:14px Lato;color:#2c1e10\">{{ selectedBook.pages }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:9px 0;border-bottom:1px solid #f0e8dc\">\n          <div style=\"font:700 10px Lato;color:#c0a890;text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px\">Source<\u002Fdiv>\n          <div style=\"font:14px Lato;color:#2c1e10\">{{ selectedBook.source }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:9px 0;border-bottom:1px solid #f0e8dc\">\n          <div style=\"font:700 10px Lato;color:#c0a890;text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px\">Date Started<\u002Fdiv>\n          <div style=\"font:14px Lato;color:#2c1e10\">{{ selectedBook.dateStarted }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:9px 0;border-bottom:1px solid #f0e8dc\">\n          <div style=\"font:700 10px Lato;color:#c0a890;text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px\">Date Finished<\u002Fdiv>\n          <div style=\"font:14px Lato;color:#2c1e10\">{{ selectedBook.dateFinished }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding:0 24px 20px;display:flex;flex-direction:column;gap:16px\">\n        <div>\n          <div style=\"font:700 10px Lato;color:#c0a890;text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px\">Description<\u002Fdiv>\n          <div style=\"font:14px/1.65 Lato;color:#4a3c2c\">{{ selectedBook.description }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font:700 10px Lato;color:#c0a890;text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px\">My Notes<\u002Fdiv>\n          <div style=\"font:14px/1.65 Lato;color:#4a3c2c;background:#fff8f0;padding:12px 14px;border-radius:6px;border-left:3px solid #c8a060\">{{ selectedBook.notes }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ isAdmin }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;gap:10px;padding:16px 24px;border-top:1px solid #e8ddd0;background:#fff;border-radius:0 0 14px 14px\">\n          <button onclick=\"{{ editSelectedBook }}\" style=\"flex:1;padding:10px;background:#7c5535;color:#fff;border:none;border-radius:7px;font:700 13px Lato;cursor:pointer\">Edit Book<\u002Fbutton>\n          <button onclick=\"{{ deleteSelectedBook }}\" style=\"padding:10px 20px;background:#fff;color:#b04040;border:1.5px solid #e0b0b0;border-radius:7px;font:13px Lato;cursor:pointer\">Delete<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ADD / EDIT MODAL -->\n<sc-if value=\"{{ showAddEdit }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(20,10,5,.52);z-index:130;display:flex;align-items:center;justify-content:center;padding:24px\">\n    <div style=\"background:#faf7f2;border-radius:14px;width:100%;max-width:640px;max-height:92vh;overflow-y:auto;box-shadow:0 24px 64px rgba(0,0,0,.28)\">\n\n      <div style=\"display:flex;align-items:center;padding:18px 24px;border-bottom:1px solid #e8ddd0;background:#fff;position:sticky;top:0;z-index:1;border-radius:14px 14px 0 0\">\n        <span style=\"font:700 17px 'Playfair Display',serif;color:#2c1e10\">{{ addEditTitle }}<\u002Fspan>\n        <button onclick=\"{{ closeAddEdit }}\" style=\"margin-left:auto;width:30px;height:30px;border:none;background:#f5ede0;border-radius:50%;color:#7c5535;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center\">✕<\u002Fbutton>\n      <\u002Fdiv>\n\n      <div style=\"padding:22px;display:flex;flex-direction:column;gap:14px\">\n\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px\">\n          <div>\n            <label style=\"font:700 11px Lato;color:#7a6a58;text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:5px\">Title <span style=\"color:#b04040\">*<\u002Fspan><\u002Flabel>\n            <input type=\"text\" value=\"{{ bookForm.title }}\" onchange=\"{{ onBookTitle }}\" placeholder=\"Book title\" style=\"width:100%;padding:9px 12px;border:1.5px solid #e0d0bc;border-radius:6px;font:14px Lato;color:#2c1e10;background:#fff;outline:none\">\n          <\u002Fdiv>\n          <div>\n            <label style=\"font:700 11px Lato;color:#7a6a58;text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:5px\">Author<\u002Flabel>\n            <input type=\"text\" value=\"{{ bookForm.author }}\" onchange=\"{{ onBookAuthor }}\" placeholder=\"Author name\" style=\"width:100%;padding:9px 12px;border:1.5px solid #e0d0bc;border-radius:6px;font:14px Lato;color:#2c1e10;background:#fff;outline:none\">\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px\">\n          <div>\n            <label style=\"font:700 11px Lato;color:#7a6a58;text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:5px\">Genre<\u002Flabel>\n            <input type=\"text\" value=\"{{ bookForm.genre }}\" onchange=\"{{ onBookGenre }}\" placeholder=\"e.g. Fiction\" style=\"width:100%;padding:9px 12px;border:1.5px solid #e0d0bc;border-radius:6px;font:14px Lato;color:#2c1e10;background:#fff;outline:none\">\n          <\u002Fdiv>\n          <div>\n            <label style=\"font:700 11px Lato;color:#7a6a58;text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:5px\">Year Published<\u002Flabel>\n            <input type=\"number\" value=\"{{ bookForm.yearPublished }}\" onchange=\"{{ onBookYear }}\" placeholder=\"e.g. 2020\" style=\"width:100%;padding:9px 12px;border:1.5px solid #e0d0bc;border-radius:6px;font:14px Lato;color:#2c1e10;background:#fff;outline:none\">\n          <\u002Fdiv>\n          <div>\n            <label style=\"font:700 11px Lato;color:#7a6a58;text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:5px\">Pages<\u002Flabel>\n            <input type=\"number\" value=\"{{ bookForm.pages }}\" onchange=\"{{ onBookPages }}\" placeholder=\"e.g. 320\" style=\"width:100%;padding:9px 12px;border:1.5px solid #e0d0bc;border-radius:6px;font:14px Lato;color:#2c1e10;background:#fff;outline:none\">\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px\">\n          <div>\n            <label style=\"font:700 11px Lato;color:#7a6a58;text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:5px\">Status<\u002Flabel>\n            <select value=\"{{ bookForm.status }}\" onchange=\"{{ onBookStatus }}\" style=\"width:100%;padding:9px 12px;border:1.5px solid #e0d0bc;border-radius:6px;font:14px Lato;color:#2c1e10;background:#fff;outline:none;cursor:pointer;appearance:none\">\n              <option value=\"want-to-read\">Want to Read<\u002Foption>\n              <option value=\"reading\">Reading<\u002Foption>\n              <option value=\"finished\">Finished<\u002Foption>\n              <option value=\"re-reading\">Re-reading<\u002Foption>\n              <option value=\"on-hold\">On Hold<\u002Foption>\n              <option value=\"dnf\">DNF<\u002Foption>\n            <\u002Fselect>\n          <\u002Fdiv>\n          <div>\n            <label style=\"font:700 11px Lato;color:#7a6a58;text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:5px\">Format<\u002Flabel>\n            <select value=\"{{ bookForm.type }}\" onchange=\"{{ onBookType }}\" style=\"width:100%;padding:9px 12px;border:1.5px solid #e0d0bc;border-radius:6px;font:14px Lato;color:#2c1e10;background:#fff;outline:none;cursor:pointer;appearance:none\">\n              <option value=\"physical\">📖 Physical<\u002Foption>\n              <option value=\"audiobook\">🎧 Audiobook<\u002Foption>\n              <option value=\"ebook\">📱 E-book<\u002Foption>\n            <\u002Fselect>\n          <\u002Fdiv>\n          <div>\n            <label style=\"font:700 11px Lato;color:#7a6a58;text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:5px\">Rating<\u002Flabel>\n            <select value=\"{{ bookForm.rating }}\" onchange=\"{{ onBookRating }}\" style=\"width:100%;padding:9px 12px;border:1.5px solid #e0d0bc;border-radius:6px;font:14px Lato;color:#2c1e10;background:#fff;outline:none;cursor:pointer;appearance:none\">\n              <option value=\"0\">— Unrated<\u002Foption>\n              <option value=\"1\">★ 1<\u002Foption>\n              <option value=\"2\">★★ 2<\u002Foption>\n              <option value=\"3\">★★★ 3<\u002Foption>\n              <option value=\"4\">★★★★ 4<\u002Foption>\n              <option value=\"5\">★★★★★ 5<\u002Foption>\n            <\u002Fselect>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px\">\n          <div>\n            <label style=\"font:700 11px Lato;color:#7a6a58;text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:5px\">Date Started<\u002Flabel>\n            <input type=\"date\" value=\"{{ bookForm.dateStarted }}\" onchange=\"{{ onBookDateStarted }}\" style=\"width:100%;padding:9px 12px;border:1.5px solid #e0d0bc;border-radius:6px;font:14px Lato;color:#2c1e10;background:#fff;outline:none\">\n          <\u002Fdiv>\n          <div>\n            <label style=\"font:700 11px Lato;color:#7a6a58;text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:5px\">Date Finished<\u002Flabel>\n            <input type=\"date\" value=\"{{ bookForm.dateFinished }}\" onchange=\"{{ onBookDateFinished }}\" style=\"width:100%;padding:9px 12px;border:1.5px solid #e0d0bc;border-radius:6px;font:14px Lato;color:#2c1e10;background:#fff;outline:none\">\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px\">\n          <div>\n            <label style=\"font:700 11px Lato;color:#7a6a58;text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:5px\">Source<\u002Flabel>\n            <input type=\"text\" value=\"{{ bookForm.source }}\" onchange=\"{{ onBookSource }}\" placeholder=\"Bought, Library, Gift…\" style=\"width:100%;padding:9px 12px;border:1.5px solid #e0d0bc;border-radius:6px;font:14px Lato;color:#2c1e10;background:#fff;outline:none\">\n          <\u002Fdiv>\n          <div>\n            <label style=\"font:700 11px Lato;color:#7a6a58;text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:5px\">Cover Image URL<\u002Flabel>\n            <input type=\"url\" value=\"{{ bookForm.coverUrl }}\" onchange=\"{{ onBookCoverUrl }}\" placeholder=\"https://…\" style=\"width:100%;padding:9px 12px;border:1.5px solid #e0d0bc;border-radius:6px;font:14px Lato;color:#2c1e10;background:#fff;outline:none\">\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div>\n          <label style=\"font:700 11px Lato;color:#7a6a58;text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:5px\">Description / Synopsis<\u002Flabel>\n          <textarea value=\"{{ bookForm.description }}\" onchange=\"{{ onBookDesc }}\" placeholder=\"Brief description of the book…\" rows=\"3\" style=\"width:100%;padding:9px 12px;border:1.5px solid #e0d0bc;border-radius:6px;font:14px Lato;color:#2c1e10;background:#fff;outline:none;resize:vertical\"><\u002Ftextarea>\n        <\u002Fdiv>\n\n        <div>\n          <label style=\"font:700 11px Lato;color:#7a6a58;text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:5px\">My Notes<\u002Flabel>\n          <textarea value=\"{{ bookForm.notes }}\" onchange=\"{{ onBookNotes }}\" placeholder=\"Your personal thoughts and notes…\" rows=\"3\" style=\"width:100%;padding:9px 12px;border:1.5px solid #e0d0bc;border-radius:6px;font:14px Lato;color:#2c1e10;background:#fff;outline:none;resize:vertical\"><\u002Ftextarea>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;gap:10px;padding-top:6px;border-top:1px solid #e8ddd0\">\n          <button onclick=\"{{ saveBook }}\" style=\"flex:1;padding:11px;background:#7c5535;color:#fff;border:none;border-radius:7px;font:700 14px Lato;cursor:pointer\">Save Book<\u002Fbutton>\n          <button onclick=\"{{ closeAddEdit }}\" style=\"padding:11px 20px;background:#faf7f2;color:#9a8878;border:1.5px solid #e0d0bc;border-radius:7px;font:14px Lato;cursor:pointer\">Cancel<\u002Fbutton>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- IMPORT MODAL -->\n<sc-if value=\"{{ showImport }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(20,10,5,.52);z-index:140;display:flex;align-items:center;justify-content:center;padding:24px\">\n    <div style=\"background:#faf7f2;border-radius:14px;width:100%;max-width:580px;max-height:88vh;overflow-y:auto;box-shadow:0 24px 64px rgba(0,0,0,.28)\">\n\n      <div style=\"display:flex;align-items:center;padding:18px 24px;border-bottom:1px solid #e8ddd0;background:#fff;border-radius:14px 14px 0 0\">\n        <span style=\"font:700 17px 'Playfair Display',serif;color:#2c1e10\">Import Books from CSV<\u002Fspan>\n        <button onclick=\"{{ closeImport }}\" style=\"margin-left:auto;width:30px;height:30px;border:none;background:#f5ede0;border-radius:50%;color:#7c5535;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center\">✕<\u002Fbutton>\n      <\u002Fdiv>\n\n      <div style=\"padding:22px;display:flex;flex-direction:column;gap:16px\">\n\n        <div style=\"background:#f5ede0;border:1px solid #e0d0bc;border-radius:8px;padding:16px\">\n          <div style=\"font:700 12px Lato;color:#7a6a58;margin-bottom:8px\">Required CSV Format<\u002Fdiv>\n          <div style=\"font:11px/1.5 'Courier New',monospace;color:#5a4030;word-break:break-all\">title,author,genre,year_published,pages,status,type,rating,dateStarted,dateFinished,description,notes,source<\u002Fdiv>\n          <div style=\"margin-top:10px;font:11px/1.7 'Courier New',monospace;color:#8a7060\">status: reading | want-to-read | finished | dnf | on-hold | re-reading<br>type: physical | audiobook | ebook<br>rating: 0–5 (0 = unrated)&nbsp;&nbsp;dates: YYYY-MM-DD<\u002Fdiv>\n          <div style=\"margin-top:8px;font:11px Lato;color:#b0a090\">Wrap fields containing commas in double quotes. Only title is required.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div>\n          <label style=\"font:700 11px Lato;color:#7a6a58;text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:8px\">Paste CSV data here<\u002Flabel>\n          <textarea value=\"{{ importText }}\" onchange=\"{{ onImportText }}\" placeholder=\"title,author,genre,…\nThe Great Gatsby,F. Scott Fitzgerald,Fiction,…\" rows=\"8\" style=\"width:100%;padding:10px 12px;border:1.5px solid #e0d0bc;border-radius:6px;font:12px 'Courier New',monospace;color:#2c1e10;background:#fff;outline:none;resize:vertical\"><\u002Ftextarea>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ hasImportErr }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:10px 14px;background:#fff0f0;border:1px solid #e0b0b0;border-radius:6px;font:13px Lato;color:#b04040\">{{ importErr }}<\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"display:flex;gap:10px\">\n          <button onclick=\"{{ doImport }}\" style=\"flex:1;padding:11px;background:#7c5535;color:#fff;border:none;border-radius:7px;font:700 13px Lato;cursor:pointer\">Import Books<\u002Fbutton>\n          <button onclick=\"{{ closeImport }}\" style=\"padding:11px 20px;background:#faf7f2;color:#9a8878;border:1.5px solid #e0d0bc;border-radius:7px;font:13px Lato;cursor:pointer\">Cancel<\u002Fbutton>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = {\n    isAdmin:false, showLogin:false, loginUser:'', loginPass:'', loginErr:'',\n    books:[], goals:{booksGoal:30,targetGenre:'',dailyPages:50}, dailyLog:{},\n    showGoals:false, goalsEdit:false, goalsForm:{booksGoal:30,targetGenre:'',dailyPages:50},\n    selectedBookId:null, showAddEdit:false,\n    bookForm:{title:'',author:'',genre:'',yearPublished:'',pages:'',status:'want-to-read',type:'physical',rating:0,dateStarted:'',dateFinished:'',description:'',notes:'',source:'',coverUrl:''},\n    showImport:false, importText:'', importErr:'',\n    filterStatus:'all', filterGenre:'all', filterRating:'all', searchQuery:'', sortBy:'date-added', viewMode:'grid', page:1,\n    calMonth:new Date().getMonth(), calYear:new Date().getFullYear(),\n  };\n\n  componentDidMount() {\n    try {\n      const rb=localStorage.getItem('dl_books'), rg=localStorage.getItem('dl_goals'), rd=localStorage.getItem('dl_daily');\n      const isAdmin=localStorage.getItem('dl_admin')==='1';\n      const books=rb?JSON.parse(rb):this.sampleBooks();\n      const goals=rg?JSON.parse(rg):{booksGoal:30,targetGenre:'',dailyPages:50};\n      const dailyLog=rd?JSON.parse(rd):this.seedLog();\n      if(!rb) this.save('dl_books',books);\n      if(!rd) this.save('dl_daily',dailyLog);\n      this.setState({books,goals,dailyLog,isAdmin});\n    } catch(e){ this.setState({books:this.sampleBooks()}); }\n  }\n\n  save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}\n\n  today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}\n\n  uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}\n\n  monthName(m){return ['January','February','March','April','May','June','July','August','September','October','November','December'][m];}\n\n  seedLog(){\n    const log={},now=new Date();\n    const p=['met','met','partial','met','missed','met','met','met','partial','missed','met','met','partial','met'];\n    for(let i=1;i<now.getDate();i++){\n      const ds=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;\n      log[ds]=p[(i-1)%p.length];\n    }\n    return log;\n  }\n\n  sampleBooks(){\n    const y=new Date().getFullYear(), u=()=>this.uid(), ts=new Date().toISOString();\n    return [\n      {id:u(),title:'Sapiens',author:'Yuval Noah Harari',genre:'Non-Fiction',yearPublished:2011,pages:443,status:'finished',type:'physical',rating:5,dateStarted:`${y}-01-02`,dateFinished:`${y}-01-28`,description:'A brief history of humankind from the Stone Age to the present day.',notes:'Completely changed how I think about human history.',source:'Bought',coverUrl:'',createdAt:ts},\n      {id:u(),title:'Educated',author:'Tara Westover',genre:'Biography',yearPublished:2018,pages:334,status:'finished',type:'physical',rating:5,dateStarted:`${y}-02-01`,dateFinished:`${y}-02-18`,description:'A memoir about a woman who grew up in a survivalist family and earned a PhD from Cambridge.',notes:'One of the most powerful memoirs I have ever read.',source:'Bought',coverUrl:'',createdAt:ts},\n      {id:u(),title:'Pachinko',author:'Min Jin Lee',genre:'Fiction',yearPublished:2017,pages:485,status:'finished',type:'physical',rating:5,dateStarted:`${y}-02-22`,dateFinished:`${y}-03-14`,description:'An epic saga about a Korean family across four generations in Japan.',notes:'Heartbreaking and beautiful. Completely engrossing.',source:'Bought',coverUrl:'',createdAt:ts},\n      {id:u(),title:'Dune',author:'Frank Herbert',genre:'Sci-Fi',yearPublished:1965,pages:688,status:'finished',type:'physical',rating:4,dateStarted:`${y}-03-18`,dateFinished:`${y}-04-10`,description:'A science fiction epic set on the desert planet Arrakis, following young Paul Atreides.',notes:'Dense but rewarding. Unparalleled worldbuilding.',source:'Bought',coverUrl:'',createdAt:ts},\n      {id:u(),title:'Foundation',author:'Isaac Asimov',genre:'Sci-Fi',yearPublished:1951,pages:255,status:'finished',type:'physical',rating:4,dateStarted:`${y}-04-15`,dateFinished:`${y}-04-28`,description:'A galactic empire falls; a scientist attempts to preserve knowledge through the ensuing Dark Ages.',notes:'A classic for good reason.',source:'Bought',coverUrl:'',createdAt:ts},\n      {id:u(),title:'The Brothers Karamazov',author:'Fyodor Dostoevsky',genre:'Fiction',yearPublished:1880,pages:796,status:'reading',type:'physical',rating:0,dateStarted:`${y}-06-01`,dateFinished:'',description:'A philosophical novel about God, morality, and free will set in 19th-century Russia.',notes:'',source:'Bought',coverUrl:'',createdAt:ts},\n      {id:u(),title:'The Warmth of Other Suns',author:'Isabel Wilkerson',genre:'History',yearPublished:2010,pages:622,status:'reading',type:'physical',rating:0,dateStarted:`${y}-06-15`,dateFinished:'',description:\"The epic story of America's Great Migration told through three individuals.\",notes:'',source:'Library',coverUrl:'',createdAt:ts},\n      {id:u(),title:'Noise',author:'Daniel Kahneman',genre:'Non-Fiction',yearPublished:2021,pages:454,status:'reading',type:'audiobook',rating:0,dateStarted:`${y}-07-01`,dateFinished:'',description:'An exploration of why human judgment is far more variable than we realise.',notes:'',source:'Bought',coverUrl:'',createdAt:ts},\n      {id:u(),title:'Piranesi',author:'Susanna Clarke',genre:'Fantasy',yearPublished:2020,pages:272,status:'want-to-read',type:'physical',rating:0,dateStarted:'',dateFinished:'',description:'A mysterious novel set in a labyrinthine house filled with infinite halls and statues.',notes:'Highly recommended by multiple friends.',source:'Gift',coverUrl:'',createdAt:ts},\n      {id:u(),title:'The Midnight Library',author:'Matt Haig',genre:'Fiction',yearPublished:2020,pages:304,status:'want-to-read',type:'physical',rating:0,dateStarted:'',dateFinished:'',description:'Between life and death there is a library with infinite books, each showing a different life.',notes:'',source:'Bought',coverUrl:'',createdAt:ts},\n      {id:u(),title:'Never Let Me Go',author:'Kazuo Ishiguro',genre:'Fiction',yearPublished:2005,pages:288,status:'want-to-read',type:'physical',rating:0,dateStarted:'',dateFinished:'',description:'A haunting novel about three friends at an English boarding school with a dark secret.',notes:'',source:'Library',coverUrl:'',createdAt:ts},\n      {id:u(),title:'Infinite Jest',author:'David Foster Wallace',genre:'Fiction',yearPublished:1996,pages:1104,status:'on-hold',type:'physical',rating:0,dateStarted:`${y}-04-20`,dateFinished:'',description:'A dense maximalist novel set in a tennis academy and a halfway house.',notes:'Pausing for now. Will return.',source:'Bought',coverUrl:'',createdAt:ts},\n    ];\n  }\n\n  emptyForm(){return {title:'',author:'',genre:'',yearPublished:'',pages:'',status:'want-to-read',type:'physical',rating:0,dateStarted:'',dateFinished:'',description:'',notes:'',source:'',coverUrl:''};}\n\n  handleLogin(){\n    const {loginUser,loginPass}=this.state;\n    const u=localStorage.getItem('dl_cu')||'admin', p=localStorage.getItem('dl_cp')||'booklover';\n    if(loginUser.trim()===u&&loginPass===p){\n      this.setState({isAdmin:true,showLogin:false,loginErr:'',loginUser:'',loginPass:''});\n      localStorage.setItem('dl_admin','1');\n    } else {\n      this.setState({loginErr:'Incorrect username or password.'});\n    }\n  }\n\n  handleLogout(){this.setState({isAdmin:false});localStorage.removeItem('dl_admin');}\n\n  handleSaveGoals(){\n    const {goalsForm}=this.state;\n    const goals={booksGoal:parseInt(goalsForm.booksGoal)||30,targetGenre:(goalsForm.targetGenre||'').trim(),dailyPages:parseInt(goalsForm.dailyPages)||50};\n    this.setState({goals,goalsEdit:false});\n    this.save('dl_goals',goals);\n  }\n\n  handleDailyLog(status){\n    const dailyLog={...this.state.dailyLog,[this.today()]:status};\n    this.setState({dailyLog});\n    this.save('dl_daily',dailyLog);\n  }\n\n  handleSaveBook(){\n    const {bookForm,showAddEdit,books}=this.state;\n    if(!bookForm.title.trim()) return;\n    const form={...bookForm,rating:parseInt(bookForm.rating)||0,pages:parseInt(bookForm.pages)||0,yearPublished:parseInt(bookForm.yearPublished)||''};\n    let nb;\n    if(showAddEdit==='add'){\n      nb=[{...form,id:this.uid(),createdAt:new Date().toISOString()},...books];\n    } else {\n      nb=books.map(b=>b.id===showAddEdit?{...b,...form}:b);\n    }\n    this.setState({books:nb,showAddEdit:false});\n    this.save('dl_books',nb);\n  }\n\n  handleDeleteBook(id){\n    if(!window.confirm('Delete this book from your library?')) return;\n    const nb=this.state.books.filter(b=>b.id!==id);\n    this.setState({books:nb,selectedBookId:null,showAddEdit:false});\n    this.save('dl_books',nb);\n  }\n\n  handleImport(){\n    const {importText,books}=this.state;\n    try {\n      const imported=this.parseCSV(importText);\n      if(!imported.length) throw new Error('No valid books found. Check the format.');\n      const nb=[...books,...imported];\n      this.setState({books:nb,showImport:false,importText:'',importErr:''});\n      this.save('dl_books',nb);\n    } catch(e){this.setState({importErr:e.message});}\n  }\n\n  parseCSV(text){\n    const lines=text.trim().split(/\\r?\\n/).filter(l=>l.trim());\n    if(lines.length<2) throw new Error('CSV needs a header row and at least one data row.');\n    const hdrs=this.csvLine(lines[0]).map(h=>h.trim().toLowerCase().replace(/[\\s-]+/g,'_'));\n    const out=[];\n    for(let i=1;i<lines.length;i++){\n      const vals=this.csvLine(lines[i]);\n      if(!vals.some(v=>v.trim())) continue;\n      const obj={id:this.uid(),createdAt:new Date().toISOString(),coverUrl:''};\n      hdrs.forEach((h,idx)=>{obj[h]=(vals[idx]||'').trim();});\n      if(obj.year_published) obj.yearPublished=parseInt(obj.year_published)||'';\n      obj.rating=parseInt(obj.rating)||0;\n      obj.pages=parseInt(obj.pages)||0;\n      if(!obj.title) continue;\n      if(!obj.status) obj.status='want-to-read';\n      if(!obj.type) obj.type='physical';\n      out.push(obj);\n    }\n    return out;\n  }\n\n  csvLine(line){\n    const r=[];let c='',q=false;\n    for(let i=0;i<line.length;i++){\n      if(line[i]==='\"') q=!q;\n      else if(line[i]===',' && !q){r.push(c);c='';}\n      else c+=line[i];\n    }\n    r.push(c);return r;\n  }\n\n  getFiltered(){\n    const {books,filterStatus,filterGenre,filterRating,searchQuery,sortBy}=this.state;\n    let f=books;\n    if(filterStatus!=='all') f=f.filter(b=>b.status===filterStatus);\n    if(filterGenre!=='all') f=f.filter(b=>b.genre===filterGenre);\n    if(filterRating!=='all'){\n      if(filterRating==='0') f=f.filter(b=>!b.rating||b.rating===0);\n      else f=f.filter(b=>b.rating===parseInt(filterRating));\n    }\n    if(searchQuery.trim()){\n      const q=searchQuery.toLowerCase();\n      f=f.filter(b=>b.title.toLowerCase().includes(q)||b.author.toLowerCase().includes(q)||(b.genre||'').toLowerCase().includes(q));\n    }\n    return [...f].sort((a,b)=>{\n      if(sortBy==='title') return a.title.localeCompare(b.title);\n      if(sortBy==='author') return a.author.localeCompare(b.author);\n      if(sortBy==='rating') return (b.rating||0)-(a.rating||0);\n      if(sortBy==='date-finished') return (b.dateFinished?new Date(b.dateFinished):0)-(a.dateFinished?new Date(a.dateFinished):0);\n      if(sortBy==='format') return (a.type||'').localeCompare(b.type||'');\n      if(sortBy==='source') return (a.source||'').localeCompare(b.source||'');\n      return new Date(b.createdAt||0)-new Date(a.createdAt||0);\n    });\n  }\n\n  sLabel(s){return {reading:'Reading','want-to-read':'Want to Read',finished:'Finished',dnf:'DNF','on-hold':'On Hold','re-reading':'Re-reading'}[s]||s;}\n  sBg(s){return {reading:'#3a5f8a','want-to-read':'#7a6a58',finished:'#3d7a54',dnf:'#b04040','on-hold':'#b07028','re-reading':'#6a4880'}[s]||'#7a6a58';}\n  stars(n){const v=n||0;return '★'.repeat(v)+'☆'.repeat(5-v);}\n\n  getDonut(){\n    const {goals,books}=this.state, yr=new Date().getFullYear();\n    const done=books.filter(b=>b.status==='finished'&&b.dateFinished&&new Date(b.dateFinished).getFullYear()===yr).length;\n    const goal=Math.max(goals.booksGoal||30,1);\n    const pc
